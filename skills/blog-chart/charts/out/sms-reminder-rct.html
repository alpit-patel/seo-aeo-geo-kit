  <title id="sms-reminder-rct-title">No-Show Rate: With vs. Without SMS Reminders</title>
  <desc id="sms-reminder-rct-desc">Grouped bar chart from a randomized controlled trial at an urban pediatric clinic. The no-show rate was 38.1% in the control group that received only a standard voice message reminder, versus 23.5% in the group that also received an SMS text reminder, a 14.6 percentage point reduction (p = 0.04). Source: Lin et al., International Journal of Pediatrics, 2016.</desc>
  <text x="280.0" y="29" text-anchor="middle" font-size="18" font-weight="800" fill="currentColor">No-Show Rate: With vs. Without SMS Reminders</text>

<line x1="72" y1="230.8" x2="492" y2="230.8" stroke="currentColor" opacity="0.08" />
