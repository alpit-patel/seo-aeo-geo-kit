<figure class="blog-chart">
<svg viewBox="0 0 560 380" style="max-width: 100%; height: auto; font-family: 'Inter', system-ui, sans-serif; --chart-muted: #4b5563;" role="img" aria-labelledby="lead-response-odds-title lead-response-odds-desc">
  <style>

  <title id="lead-response-odds-title">Lead Response Odds by Speed</title>
  <desc id="lead-response-odds-desc">Line chart showing how lead response odds fall as response time rises, using the published multipliers from the 2007 MIT/InsideSales.com Lead Response Management Study and the 2011 Harvard Business Review audit of 2,241 US firms. Responding within 5 minutes yields roughly 100x the odds of contacting a lead versus 30 minutes, 21x the odds of qualifying, and responding within 1 hour is about 7x more likely to qualify than responding later. Waiting 24 hours or longer drops odds toward a 1x baseline. Source: MIT &amp; InsideSales.com (2007); HBR (2011).</desc>
  <text x="280.0" y="29" text-anchor="middle" font-size="18" font-weight="800" fill="currentColor">Lead Response Odds by Speed</text>
  <text x="280.0" y="48.0" text-anchor="middle" font-size="12" fill="var(--chart-muted, currentColor)"><tspan x="280.0" dy="0">Multiplier vs. baseline, published study values</tspan></text>

<line x1="70" y1="239.5" x2="500" y2="239.5" stroke="currentColor" opacity="0.08" />

<text x="213.3" y="312.0" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.8"><tspan x="213.3" dy="0">30 min</tspan></text>
